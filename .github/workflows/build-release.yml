name: Build Python3 for 极路由 (mipsel musl soft-float, 全模块)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CPython
        uses: actions/checkout@v4
        with:
          repository: python/cpython
          ref: v3.11.7
          path: cpython

      - name: Setup Python 3.11 (for cross compile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev perl \
            tclsh pkg-config xz-utils wget

      - name: Install OpenWrt SDK for mt7620
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7620/openwrt-sdk-23.05.3-ramips-mt7620_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mkdir -p openwrt-sdk
          tar xf openwrt-sdk-*.tar.xz -C openwrt-sdk --strip-components=1
          TOOLCHAIN_DIR=$(find openwrt-sdk/staging_dir -type d -name 'toolchain-*' | head -1)
          TOOLCHAIN_DIR="$PWD/$TOOLCHAIN_DIR"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$PWD/openwrt-sdk/staging_dir" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "=== Toolchain dir ==="
          echo "$TOOLCHAIN_DIR"
          echo "=== Cross compiler ==="
          ls "$TOOLCHAIN_DIR/bin" | grep 'mipsel' | head -10 || true

      - name: Cross-compile zlib (static)
        run: |
          cd /tmp
          curl -L --retry 3 -o zlib.tar.gz \
            "https://zlib.net/fossils/zlib-1.3.1.tar.gz"
          tar xzf zlib.tar.gz
          cd zlib-1.3.1
          
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          
          CC=mipsel-openwrt-linux-musl-gcc \
          AR=mipsel-openwrt-linux-musl-ar \
          RANLIB=mipsel-openwrt-linux-musl-ranlib \
          ./configure \
            --prefix=/tmp/zlib-mipsel \
            --static
          
          make -j$(nproc)
          make install
          
          echo "=== zlib installed ==="
          ls -la /tmp/zlib-mipsel/include/
          ls -la /tmp/zlib-mipsel/lib/

      - name: Cross-compile OpenSSL (static)
        run: |
          cd /tmp
          curl -L --retry 3 -o openssl.tar.gz \
            "https://www.openssl.org/source/openssl-3.0.13.tar.gz"
          tar xzf openssl.tar.gz
          cd openssl-3.0.13
          
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          
          CC=mipsel-openwrt-linux-musl-gcc \
          CXX=mipsel-openwrt-linux-musl-g++ \
          AR=mipsel-openwrt-linux-musl-ar \
          RANLIB=mipsel-openwrt-linux-musl-ranlib \
          ./Configure linux-mips32 \
            --prefix=/tmp/openssl-mipsel \
            threads \
            no-asm \
            no-shared no-module no-legacy no-tests no-comp no-zlib no-ssl3 \
            -static -Os
          
          make -j$(nproc)
          make install_sw
          
          CONF_H="/tmp/openssl-mipsel/include/openssl/opensslconf.h"
          if ! grep -q "OPENSSL_THREADS" "$CONF_H" 2>/dev/null; then
            echo "Injecting OPENSSL_THREADS into opensslconf.h..."
            echo "#define OPENSSL_THREADS" >> "$CONF_H"
          fi
          echo "=== opensslconf.h OPENSSL_THREADS check ==="
          grep "OPENSSL_THREADS" "$CONF_H" || true

      - name: Force core C extensions as built-in (safe subset only)
        run: |
          cat > cpython/Modules/Setup.local << 'EOF'
          *static*

          # SSL / Hash (need OpenSSL paths)
          _ssl _ssl.c -I/tmp/openssl-mipsel/include -L/tmp/openssl-mipsel/lib -lssl -lcrypto
          _hashlib _hashopenssl.c -I/tmp/openssl-mipsel/include -L/tmp/openssl-mipsel/lib -lssl -lcrypto

          # Math / Random / Date (zero external deps, never fail)
          math mathmodule.c
          _random _randommodule.c
          _datetime _datetimemodule.c

          # Data structures / Serialization
          _struct _struct.c
          _json _json.c
          _pickle _pickle.c
          array arraymodule.c
          _heapq _heapqmodule.c
          _bisect _bisectmodule.c

          # Encoding / Compression (use self-built static zlib)
          binascii binascii.c -I/tmp/zlib-mipsel/include -L/tmp/zlib-mipsel/lib
          zlib zlibmodule.c -I/tmp/zlib-mipsel/include -L/tmp/zlib-mipsel/lib -lz

          # Hash family
          _md5 md5module.c
          _sha1 sha1module.c
          _sha256 sha256module.c
          _sha512 sha512module.c
          _sha3 _sha3/sha3module.c
          _blake2 _blake2/blake2module.c _blake2/blake2b_impl.c _blake2/blake2s_impl.c

          # Others
          _csv _csv.c
          _contextvars _contextvarsmodule.c
          _queue _queuemodule.c
          _typing _typingmodule.c
          _opcode _opcode.c
          _asyncio _asynciomodule.c
          _zoneinfo _zoneinfo.c
          EOF
          # NOTE: _posixsubprocess, fcntl, select, _socket, _multiprocessing
          # are left for setup.py to build as .so files to avoid static link failures.

      - name: Configure cross compile
        run: |
          cd cpython
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR="$GITHUB_WORKSPACE/openwrt-sdk/staging_dir"
          
          # CRITICAL: tells setup.py the real target platform so .so files
          # are installed to lib-dynload/ instead of a wrong arch directory
          export _PYTHON_HOST_PLATFORM=linux-mipsel
          
          export CC=mipsel-openwrt-linux-musl-gcc
          export CXX=mipsel-openwrt-linux-musl-g++
          export AR=mipsel-openwrt-linux-musl-ar
          export RANLIB=mipsel-openwrt-linux-musl-ranlib
          export CFLAGS="-Os -static -march=mips32 -mtune=mips32"
          export CPPFLAGS="-I/tmp/openssl-mipsel/include -I/tmp/zlib-mipsel/include"
          export LDFLAGS="-static -L/tmp/openssl-mipsel/lib -L/tmp/zlib-mipsel/lib"
          export LIBS="-lssl -lcrypto -lz"
          
          ./configure \
            --host=mipsel-openwrt-linux-musl \
            --build=x86_64-linux-gnu \
            --prefix=/tmp/python-mipsel \
            --with-build-python=$(which python3) \
            --with-openssl=/tmp/openssl-mipsel \
            --disable-ipv6 \
            --without-ensurepip \
            --disable-test-modules \
            --enable-optimizations=no \
            ac_cv_file__dev_ptmx=no \
            ac_cv_file__dev_ptc=no \
            ac_cv_func_setpgrp_void=yes

      - name: Build
        run: |
          cd cpython
          make -j$(nproc)

      - name: Install & Strip & Fix Symlinks
        run: |
          cd cpython
          make install
          mipsel-openwrt-linux-musl-strip /tmp/python-mipsel/bin/python3.11

          rm -rf /tmp/python-mipsel/lib/python3.11/test
          rm -rf /tmp/python-mipsel/lib/python3.11/lib2to3/tests
          rm -rf /tmp/python-mipsel/lib/python3.11/idlelib
          rm -rf /tmp/python-mipsel/lib/python3.11/tkinter
          rm -rf /tmp/python-mipsel/lib/python3.11/turtledemo
          rm -rf /tmp/python-mipsel/lib/python3.11/ensurepip
          rm -rf /tmp/python-mipsel/include
          rm -f /tmp/python-mipsel/lib/python3.11/config-3.11/libpython3.11.a

          cd /tmp/python-mipsel/bin
          chmod +x python3.11 2>/dev/null || true
          rm -f python3 && ln -s python3.11 python3
          rm -f 2to3 && ln -s 2to3-3.11 2to3
          rm -f idle3 && ln -s idle3.11 idle3
          rm -f pydoc3 && ln -s pydoc3.11 pydoc3

      - name: Build missing extension modules manually (fallback)
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          LIB_DYNLOAD="/tmp/python-mipsel/lib/python3.11/lib-dynload"
          PY_INC="/tmp/python-mipsel/include/python3.11"
          SRC="$GITHUB_WORKSPACE/cpython/Modules"
          
          mkdir -p "$LIB_DYNLOAD"
          
          # Helper to build a .so if missing
          build_so() {
            local name="$1"
            local srcfile="$2"
            local extra="$3"
            local outfile="$LIB_DYNLOAD/${name}.so"
            
            if [ -f "$outfile" ]; then
              echo "OK: $name.so already exists"
              return 0
            fi
            
            echo "Building $name.so from $srcfile ..."
            mipsel-openwrt-linux-musl-gcc -shared -fPIC -Os \
              -I"$PY_INC" -I"$GITHUB_WORKSPACE/cpython/Include" -I"$GITHUB_WORKSPACE/cpython" \
              $extra \
              "$srcfile" \
              -o "$outfile"
            
            if [ -f "$outfile" ]; then
              echo "OK: $name.so built"
            else
              echo "ERROR: failed to build $name.so"
              return 1
            fi
          }
          
          # Critical modules for pip / subprocess / networking
          build_so "_posixsubprocess" "$SRC/_posixsubprocess.c"
          build_so "fcntl"           "$SRC/fcntlmodule.c"
          build_so "select"          "$SRC/selectmodule.c"
          build_so "_socket"         "$SRC/socketmodule.c"
          build_so "_multiprocessing" "$SRC/_multiprocessing/multiprocessing.c $SRC/_multiprocessing/semaphore.c"
          build_so "_posixshmem"     "$SRC/_multiprocessing/posixshmem.c"
          build_so "syslog"          "$SRC/syslogmodule.c"
          build_so "termios"         "$SRC/termios.c"
          build_so "resource"        "$SRC/resource.c"
          build_so "_crypt"          "$SRC/_cryptmodule.c" || true  # may fail if no crypt.h
          build_so "spwd"            "$SRC/spwdmodule.c" || true    # may fail
          build_so "grp"             "$SRC/grpmodule.c"
          build_so "pwd"             "$SRC/pwdmodule.c"
          
          echo "=== Final lib-dynload contents ==="
          ls -la "$LIB_DYNLOAD/" || true

      - name: Verify critical modules
        run: |
          echo "=== Verify static-linked modules ==="
          for sym in PyInit_math PyInit__random PyInit__datetime PyInit__json PyInit__struct PyInit_array PyInit_binascii PyInit_zlib PyInit__md5 PyInit__sha256 PyInit__sha512; do
            if mipsel-openwrt-linux-musl-nm /tmp/python-mipsel/bin/python3.11 | grep -q "$sym"; then
              echo "STATIC OK: $sym"
            else
              echo "STATIC WARN: $sym missing"
            fi
          done
          
          echo "=== Verify dynamic modules ==="
          LIB_DYNLOAD="/tmp/python-mipsel/lib/python3.11/lib-dynload"
          for mod in _posixsubprocess fcntl select _socket _multiprocessing grp pwd termios resource; do
            if [ -f "$LIB_DYNLOAD/${mod}.so" ]; then
              echo "DYNAMIC OK: ${mod}.so"
            else
              echo "DYNAMIC WARN: ${mod}.so missing"
            fi
          done

      - name: Verify static link & soft-float
        run: |
          echo "=== Checking if python3.11 is statically linked ==="
          file /tmp/python-mipsel/bin/python3.11
          readelf -l /tmp/python-mipsel/bin/python3.11 | grep -i "interpreter" || true
          if readelf -l /tmp/python-mipsel/bin/python3.11 | grep -q "interpreter"; then
            echo "WARNING: python3.11 is NOT fully static!"
          else
            echo "OK: python3.11 appears to be statically linked."
          fi
          
          echo "=== Checking for hard-float instructions ==="
          if mipsel-openwrt-linux-musl-objdump -d /tmp/python-mipsel/bin/python3.11 | grep -Eq '\s(ldc1|sdc1|add\.s|mul\.s|c\.eq\.s|madd\.s)\s'; then
            echo "WARNING: Found FPU instructions!"
          else
            echo "OK: No FPU instructions found (soft-float confirmed)."
          fi

      - name: Install pip for target
        run: |
          SITE_PACKAGES="/tmp/python-mipsel/lib/python3.11/site-packages"
          BIN_DIR="/tmp/python-mipsel/bin"
          BUNDLED_DIR="$GITHUB_WORKSPACE/cpython/Lib/ensurepip/_bundled"
          
          mkdir -p "$SITE_PACKAGES"
          
          for whl in "$BUNDLED_DIR"/*.whl; do
            if [ -f "$whl" ]; then
              echo "Installing $(basename "$whl") ..."
              python3 -m zipfile -e "$whl" "$SITE_PACKAGES"
            fi
          done
          
          cat > "$BIN_DIR/pip3.11" << 'SCRIPT'
          #!/usr/bin/env python3.11
          # -*- coding: utf-8 -*-
          import re
          import sys
          from pip._internal.cli.main import main
          if __name__ == '__main__':
              sys.argv[0] = re.sub(r'(-script\.pyw|\.exe)?$', '', sys.argv[0])
              sys.exit(main())
          SCRIPT
          chmod +x "$BIN_DIR/pip3.11"
          ln -sf pip3.11 "$BIN_DIR/pip3"
          ln -sf pip3.11 "$BIN_DIR/pip"

      - name: Pre-install common pure-Python packages
        run: |
          TARGET_SITE="/tmp/python-mipsel/lib/python3.11/site-packages"
          
          pip install \
            --no-cache-dir \
            --target "$TARGET_SITE" \
            requests \
            urllib3 \
            certifi \
            idna \
            charset-normalizer \
            beautifulsoup4 \
            soupsieve \
            pytz \
            python-dateutil \
            six \
            elasticsearch \
            elastic-transport
          
          echo "=== Checking for x86_64 .so files ==="
          if find "$TARGET_SITE" -name "*.so" -o -name "*.so.*" | grep -q .; then
            echo "WARNING: Found native .so files! These will NOT run on mipsel:"
            find "$TARGET_SITE" -name "*.so" -o -name "*.so.*"
          else
            echo "OK: No native .so files found."
          fi
          
          echo "=== Installed packages ==="
          ls -la "$TARGET_SITE"

      - name: Package
        run: |
          cd /tmp/python-mipsel
          tar czf $GITHUB_WORKSPACE/python-mipsel-musl-sf.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-mipsel-musl-sf
          path: python-mipsel-musl-sf.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-mipsel-musl-sf
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create or Update Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="dev-latest"
          echo "Using fixed version tag: $VERSION"
          gh release delete "$VERSION" --yes 2>/dev/null || true
          gh release create "$VERSION" \
            --title "Development Build (Latest)" \
            --notes "Automatic build from commit ${{ github.sha }}%0A%0A**Platforms:**%0A- Linux mipsel musl soft-float (极路由 - 完全静态编译)%0A- 使用 OpenWrt SDK (mt7620) 交叉编译%0A- 内置 OpenSSL / 完整 SSL 支持%0A- 软浮点 (无 FPU 设备兼容)%0A- 核心C扩展静态链接 + 系统调用模块动态加载%0A- 包含 pip / requests / beautifulsoup4 / elasticsearch 等" \
            --prerelease \
            artifacts/python-mipsel-musl-sf.tar.gz